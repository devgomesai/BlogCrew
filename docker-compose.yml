# Both halves on one box, sharing the Blog volume — the deployment shape the
# README describes. `docker compose up -d` creates or starts, no manual steps.
services:
  redis:
    image: redis:6
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE:-blogcrew-backend}
    build: ./backend
    ports:
      - "8123:8000"
    env_file: ./backend/.env
    environment:
      REDIS_URI: redis://redis:6379
      DATABASE_URI: postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable
    volumes:
      # Generated posts live here; the frontend reads the same volume.
      - blogs:/deps/backend/Blog
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:-blogcrew-frontend}
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_DEPLOYMENT_URL: ${NEXT_PUBLIC_DEPLOYMENT_URL:-http://localhost:8123}
        NEXT_PUBLIC_ASSISTANT_ID: ${NEXT_PUBLIC_ASSISTANT_ID:-blogwriter}
    ports:
      - "3000:3000"
    volumes:
      # Read-only: only the agent writes posts.
      - blogs:/backend/Blog:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  blogs:
  pgdata:
