[project]
name = "blog-writer"
version = "0.1.0"
description = "A powerful, multi-agent AI system built with DeepAgents and LangGraph. This project autonomously researches, writes, edits, and generates cover images for high-quality blog posts, along with ready-to-use social media content."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.4.12",
    "langchain>=1.2.13",
    "langchain-anthropic>=1.4.0",
    "langchain-google-genai>=4.2.1",
    "langchain-ollama>=1.0.1",
    "langchain-openai>=1.1.12",
    "langchain-openrouter>=0.2.0",
    "langgraph>=1.2.4",
    "langgraph-api>=0.7.86",
    "langgraph-cli[inmem]>=0.4.19",
    "langsmith>=0.8.9",
    "markdownify>=1.2.2",
    "pillow>=12.2.0",
    "tavily>=1.1.0",
    "diskcache>=5.6.3",
    "tenacity>=9.0.0",
    "langchain-nvidia-ai-endpoints>=1.4.3",
]
