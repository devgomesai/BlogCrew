<svg viewBox="0 0 900 380" width="900" height="380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="BlogCrew architecture">
  <style>
    text{font-family:"IBM Plex Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#18202E}
    .sub{fill:#56627A;font-size:11px}
    .monot,.lbl{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#56627A}
    .monot{font-size:11px}.lbl{font-size:10.5px}
    .box{fill:#FFFFFF;stroke:#D9DFE8;stroke-width:1.5}
    .hot{fill:#E3EBFB;stroke:#2458C6}
    .vol{fill:#F8E6E3;stroke:#B4372B}
    .edge{stroke:#56627A;stroke-width:1.4;fill:none}
    .red{stroke:#B4372B;stroke-dasharray:5 4}
  </style>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#56627A"/></marker></defs>
  <rect x="0" y="0" width="900" height="380" rx="12" fill="#F4F6F9"/>

  <rect class="box" x="20" y="30" width="230" height="200" rx="10"/>
  <text x="36" y="56" font-weight="600" font-size="14">Frontend · Next.js</text>
  <text class="monot" x="36" y="74">:3000</text>
  <rect class="box hot" x="36" y="90" width="198" height="54" rx="6"/>
  <text x="48" y="112" font-size="13" font-weight="600">/workshop</text>
  <text class="sub" x="48" y="130">chat, todos, tool calls, approvals</text>
  <rect class="box" x="36" y="158" width="198" height="54" rx="6"/>
  <text x="48" y="180" font-size="13" font-weight="600">/blogs, /blogs/[slug]</text>
  <text class="sub" x="48" y="198">reads Blog.md + frontmatter</text>

  <rect class="box" x="330" y="30" width="330" height="200" rx="10"/>
  <text x="346" y="56" font-weight="600" font-size="14">Backend · LangGraph "blogwriter"</text>
  <text class="monot" x="346" y="74">:8123 → 8000 · redis + postgres</text>
  <rect class="box hot" x="346" y="90" width="298" height="46" rx="6"/>
  <text x="358" y="110" font-size="13" font-weight="600">Orchestrator (create_deep_agent)</text>
  <text class="sub" x="358" y="126">memory: /memory/AGENTS.md · skills: /skills/</text>
  <rect class="box" x="346" y="148" width="298" height="66" rx="6"/>
  <text x="358" y="168" font-size="13" font-weight="600">Subagents</text>
  <text class="sub" x="358" y="186">planner · researcher · writer</text>
  <text class="sub" x="358" y="202">editor · humanizer</text>
  <path class="edge" d="M495 136 L495 148" marker-end="url(#ah)"/>

  <rect class="box" x="730" y="40" width="150" height="56" rx="8"/>
  <text x="744" y="64" font-size="13" font-weight="600">Tavily</text>
  <text class="sub" x="744" y="82">web search</text>
  <rect class="box" x="730" y="112" width="150" height="56" rx="8"/>
  <text x="744" y="136" font-size="13" font-weight="600">Gemini</text>
  <text class="sub" x="744" y="154">cover images</text>
  <rect class="box" x="730" y="184" width="150" height="46" rx="8"/>
  <text x="744" y="212" font-size="13" font-weight="600">LLM_CHOICE model</text>

  <rect class="box vol" x="250" y="290" width="400" height="66" rx="10"/>
  <text x="268" y="316" font-size="13" font-weight="600">Shared volume: backend/Blog/&lt;slug&gt;/</text>
  <text class="monot" x="268" y="336">Blog.md · cover.png</text>

  <path class="edge" d="M234 117 L330 117" marker-end="url(#ah)"/>
  <text class="lbl" x="252" y="108">SDK stream</text>
  <path class="edge" d="M660 180 L730 68" marker-end="url(#ah)"/>
  <path class="edge" d="M660 180 L730 140" marker-end="url(#ah)"/>
  <path class="edge" d="M660 200 L730 207" marker-end="url(#ah)"/>
  <path class="edge red" d="M495 230 L495 290" marker-end="url(#ah)"/>
  <text class="lbl" x="503" y="266">write_blog / generate_cover</text>
  <path class="edge red" d="M250 323 L135 323 L135 212" marker-end="url(#ah)"/>
  <text class="lbl" x="143" y="262">read-only</text>
</svg>
