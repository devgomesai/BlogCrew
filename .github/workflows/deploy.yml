# Builds both images in Actions (free), pushes to GHCR (free for public repos),
# then SSHes to the box and restarts compose. The box only pulls — it never
# builds, so a 1-CPU free-tier VM is enough.
name: Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository }}-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ github.repository }}-frontend:latest
          # NEXT_PUBLIC_* are baked in at build time — must be the PUBLIC URL of
          # the backend, not localhost. Set as a repo variable.
          build-args: |
            NEXT_PUBLIC_DEPLOYMENT_URL=${{ vars.NEXT_PUBLIC_DEPLOYMENT_URL }}
            NEXT_PUBLIC_ASSISTANT_ID=${{ vars.NEXT_PUBLIC_ASSISTANT_ID || 'blogwriter' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Pull and restart on the host
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ~/BlogCrew
            git pull --ff-only
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            BACKEND_IMAGE=ghcr.io/${{ github.repository }}-backend:latest \
            FRONTEND_IMAGE=ghcr.io/${{ github.repository }}-frontend:latest \
            docker compose pull
            BACKEND_IMAGE=ghcr.io/${{ github.repository }}-backend:latest \
            FRONTEND_IMAGE=ghcr.io/${{ github.repository }}-frontend:latest \
            docker compose up -d
            docker image prune -f
